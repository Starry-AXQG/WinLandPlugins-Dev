name: Update README Plugin Table

on:
  push:
    branches: [main]
    paths:
      - '*/plugin.json'
      - '*/logo.*'
      - '*/README*'
      - '*.lwp'
      - '.github/scripts/update-readme.ps1'
      - '.github/workflows/update-readme.yml'
  pull_request:
    paths:
      - '*/plugin.json'
      - '*/logo.*'
      - '*/README*'
      - '*.lwp'
      - '.github/scripts/update-readme.ps1'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate plugin manifests
        shell: pwsh
        run: ./.github/scripts/update-readme.ps1 -CheckOnly

  update-readme:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README plugin table
        shell: pwsh
        run: ./.github/scripts/update-readme.ps1

      - name: Commit and push changes
        shell: pwsh
        run: |
          $readme = Get-ChildItem -LiteralPath . -File | Where-Object { $_.Name -ieq 'README.md' } | Select-Object -First 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $readme.Name
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: update plugin table in $($readme.Name)"
            git push
            Write-Output "Updated $($readme.Name) and pushed changes."
          } else {
            Write-Output "No changes detected in $($readme.Name)."
          }
